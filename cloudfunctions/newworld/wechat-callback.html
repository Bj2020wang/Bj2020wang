<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>微信登录中...</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; background: #f5f5f5; color: #333;
}
.card {
  background: #fff; border-radius: 12px; padding: 40px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08); text-align: center; max-width: 360px;
}
.spinner {
  width: 36px; height: 36px; margin: 0 auto 16px;
  border: 3px solid #e0e0e0; border-top-color: #07C160;
  border-radius: 50%; animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
p { font-size: 14px; color: #666; }
.error { color: #e53935; font-size: 13px; margin-top: 12px; }
</style>
</head>
<body>
<div class="card">
  <div class="spinner" id="spinner"></div>
  <p id="status">正在登录...</p>
  <p class="error" id="error" style="display:none"></p>
</div>
<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var code = params.get('code') || '';
  var stateRaw = params.get('state') || '';

  var state = { r: '', a: '' };
  try { state = JSON.parse(decodeURIComponent(stateRaw)); } catch(e) { state = { r: '', a: '' }; }

  var origin = state.r || window.location.origin;
  var apiUrl = state.a || '';

  if (!code) {
    showError('缺少授权码，请重新扫码');
    redirectBack(origin + '?error=' + encodeURIComponent('缺少授权码'));
    return;
  }

  if (!apiUrl) {
    showError('回调地址配置错误');
    redirectBack(origin + '?error=' + encodeURIComponent('回调配置错误'));
    return;
  }

  document.getElementById('status').textContent = '验证中，请稍候...';

  fetch(apiUrl, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'wechat-login', payload: { code: code } })
  })
  .then(function(res) { return res.json(); })
  .then(function(data) {
    if (data.code === 0 && data.data && data.data.token) {
      var token = encodeURIComponent(data.data.token);
      var email = encodeURIComponent(data.data.email || '');
      redirectBack(origin + '?token=' + token + '&email=' + email);
    } else {
      var msg = data.message || '登录失败';
      showError(msg);
      redirectBack(origin + '?error=' + encodeURIComponent(msg));
    }
  })
  .catch(function(err) {
    var msg = err.message || '网络错误';
    showError(msg);
    redirectBack(origin + '?error=' + encodeURIComponent(msg));
  });

  function redirectBack(url) {
    setTimeout(function() { window.location.replace(url); }, 1500);
  }

  function showError(msg) {
    var el = document.getElementById('error');
    el.textContent = msg;
    el.style.display = 'block';
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('status').textContent = '登录失败';
  }
})();
</script>
</body>
</html>
